name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download OCR language data
        shell: pwsh
        run: ./scripts/Install-Tessdata.ps1
      - name: Build
        run: dotnet build MiOcrPotente.sln -c Release --no-restore
      - name: Publish
        run: dotnet publish MiOcrPotente.csproj -c Release -r win-x64 --self-contained false --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: MiOcrPotente-win-x64
          path: bin/Release/net8.0/win-x64/publish/
